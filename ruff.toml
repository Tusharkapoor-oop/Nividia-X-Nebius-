line-length = 99
target-version = "py311"
# ``demo/`` is a *target* repository (external-style code pinned to pydantic v1),
# not part of this package: it keeps its own conventions, and its pydantic v1
# validators legitimately take ``cls``.
extend-exclude = ["demo"]

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # typer/click require calls in argument defaults
    "N818",   # SpendingCapExceeded/RetriesExhausted: names kept for API clarity
    "TC001", "TC002", "TC003", # pydantic evaluates annotations at runtime
]

[lint.isort]
known-first-party = ["upgradepilot"]

[format]
quote-style = "double"
indent-style = "space"
