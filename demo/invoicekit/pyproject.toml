[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "invoicekit"
version = "0.2.0"
description = "Tiny invoice calculator - the UpgradePilot demo target (not a benchmark case)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Tushar Kapoor"}]
dependencies = ["pydantic>=1.10,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
